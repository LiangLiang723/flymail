services:
  flymail-app:
    build:
      context: .
    image: benxianyu/flymail:0.0.27
    container_name: flymail
    restart: always
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      FLYMAIL_STORAGE_ROOT: /data
      FLYMAIL_DATA_DIR: /data/flymail
      FLYMAIL_UI_DIR: /app/frontend-dist
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flymail}
      MYSQL_USER: ${MYSQL_USER:-flymail}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flymail}
      FLYMAIL_HTTP_PROXY: ${FLYMAIL_HTTP_PROXY:-}
      FLYMAIL_HTTPS_PROXY: ${FLYMAIL_HTTPS_PROXY:-}
      FLYMAIL_ALL_PROXY: ${FLYMAIL_ALL_PROXY:-}
      FLYMAIL_NO_PROXY: ${FLYMAIL_NO_PROXY:-127.0.0.1,localhost}
    volumes:
      - ${FLYMAIL_DATA_PATH:-./data}:/data
